name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Assemble site pages
        run: |
          cp README.md        docs/readme.md
          cp CATALOG.md       docs/catalog.md
          cp ARCHITECTURE.md  docs/architecture.md
          cp COVERAGE.md      docs/coverage.md
          cp CONFORMANCE_REPORT.md docs/conformance.md
          cp SDK_COVERAGE.md  docs/sdk-coverage.md
          cp CONTRIBUTING.md  docs/contributing.md
          cp docs/ARCHITECTURES.md      docs/architectures.md
          cp docs/EXAMPLES.md           docs/examples.md
          cp docs/PROGRESS.md           docs/progress.md
          cp docs/EMPIRICAL_SPEC.md     docs/empirical-spec.md
          cp docs/API_DOCS_RESEARCH.md  docs/api-docs-research.md
          # fix repo-root relative links to resolve inside the site
          sed -i -e 's|CATALOG\.md|catalog.md|g' \
                  -e 's|ARCHITECTURE\.md|architecture.md|g' \
                  -e 's|COVERAGE\.md|coverage.md|g' \
                  -e 's|CONFORMANCE_REPORT\.md|conformance.md|g' \
                  -e 's|CONTRIBUTING\.md|contributing.md|g' \
                  -e 's|docs/ARCHITECTURES\.md|architectures.md|g' \
                  -e 's|docs/EXAMPLES\.md|examples.md|g' \
                  -e 's|docs/PROGRESS\.md|progress.md|g' \
                  -e 's|docs/EMPIRICAL_SPEC\.md|empirical-spec.md|g' \
                  -e 's|docs/API_DOCS_RESEARCH\.md|api-docs-research.md|g' \
                  -e 's|\.\./COVERAGE\.md|coverage.md|g' \
                  -e 's|\.\./ROADMAP\.md|progress.md|g' \
                  docs/*.md

      - name: Build
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
