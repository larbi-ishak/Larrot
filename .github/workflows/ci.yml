name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn pydantic pytest pytest-asyncio httpx ruff

      - name: Lint
        run: |
          ruff check larrot/

      - name: Unit + integration tests
        run: |
          PYTHONPATH=. python -m pytest tests/ -v --tb=short

      - name: Start server + smoke suite
        run: |
          python -m larrot &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8200/health && break
            sleep 1
          done
          curl -s http://127.0.0.1:8200/health | grep -q '"ok"' || (echo "server failed to start" && exit 1)
          python3 tools/smoke.py

  sdk-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install with SDK extras
        run: pip install .[sdk] pytest pytest-asyncio httpx
      - name: Official SDK compatibility tests
        run: |
          PYTHONPATH=. python -m pytest tests/test_official_sdk.py -v --tb=short

  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install with proxy extras
        run: pip install .[proxy] .[dev] fastapi uvicorn pydantic
      - name: Proxy tests
        run: |
          PYTHONPATH=. python -m pytest tests/test_proxy.py -v --tb=short

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Install larrot
        run: pip install . pytest pytest-asyncio httpx fastapi uvicorn pydantic
      - name: Terraform apply/destroy against Larrot
        run: |
          PYTHONPATH=. python -m pytest tests/test_terraform.py -v --tb=short

  action-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Larrot from this repo
        uses: ./
        with:
          source: repo
      - name: Verify the action left a running simulator
        run: |
          curl -fsS "$LARROT_ENDPOINT/health" | grep -q '"ok"'
          curl -fsS "$LARROT_ENDPOINT/v3/projects" | grep -q "ap-southeast-1"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t larrot .
      - name: Smoke test in Docker
        run: |
          docker run -d -p 8200:8200 -p 8201:8201 larrot
          sleep 5
          curl -s http://127.0.0.1:8200/v3/projects | grep -q "ap-southeast-1"
          curl -s http://127.0.0.1:8201/ | grep -q "ListAllMyBucketsResult"
          echo "Docker smoke test passed"
