[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "larrot"
version = "1.1.9"
description = "Larrot repeats Huawei Cloud. A local Huawei Cloud API simulator: LocalStack, but for Huawei Cloud"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Larbi Ishak (larbizyo)" }]
keywords = ["huawei", "cloud", "simulator", "localstack", "testing", "mock", "larrot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/larbi-ishak/Larrot"

[project.scripts]
larrot = "larrot.cli:main"
larrot-server = "larrot.__main__:main"
# deprecated aliases (kept so existing installs keep working)
huawei-sim = "larrot.__main__:main"
hcli = "larrot.cli:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
