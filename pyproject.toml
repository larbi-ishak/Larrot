[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "larrot"
version = "1.4.0"
description = "Larrot repeats Huawei Cloud. A local Huawei Cloud API simulator: LocalStack, but for Huawei Cloud"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Larbi Ishak (larbizyo)" }]
keywords = ["huawei", "cloud", "simulator", "localstack", "testing", "mock", "larrot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/larbi-ishak/Larrot"

[project.scripts]
larrot = "larrot.cli:main"
larrot-server = "larrot.__main__:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
# E701/E702: the one-liner guard style (if not hasattr(s, x): s.x = {}) is
# deliberate and used consistently across all services
# E501: long lines are embedded HTML/XML strings (dashboard, console, OBS)
ignore = ["E701", "E702", "E501"]

[tool.ruff.lint.per-file-ignores]
# generated reports and embedded HTML tolerate everything
"larrot/dashboard.py" = ["E501"]
"larrot/console.py" = ["E501"]
"larrot/services/obs.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.sdist]
include = ["larrot", "README.md", "LICENSE"]
